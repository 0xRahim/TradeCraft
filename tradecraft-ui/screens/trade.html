<style>

function chart(t,v){let sd=(t.seed+v*5)*48271%2147483647;const r=()=>(sd=sd*16807%2147483647)/2147483647,d=-sg(t),u=14,ey=90,N=[44,30,30][v],ent=[N,20,12][v],sx=296/N,X=i=>12+i*sx,py=u/t.sl,rw=v?t.res:'win';
