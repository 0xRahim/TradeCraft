<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Reset password · TradeEye</title><link rel=preconnect href=https://fonts.googleapis.com><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel=stylesheet><style>*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
:root{--bg:#09090B;--card:#18181B;--acc:#27272A;--fg:#FAFAFA;--mut:#A1A1AA;--sub:#71717B;--bd:rgba(255,255,255,.1);--in:rgba(255,255,255,.15);--pri:#E4E4E7;--loss:#FF6467}
body{background:var(--bg);color:var(--fg);font:400 14px/22px Geist,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono,.chip,.mt,.eye,.time{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:var(--fg);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.pane{display:flex;flex-direction:column;padding:32px 48px;min-height:100vh}
.mid{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 0}
.box{width:100%;max-width:384px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.logo i{width:24px;height:24px;border-radius:8px;background:var(--pri);display:grid;place-items:center;color:#18181B}
h1{font-size:24px;line-height:30px;font-weight:500;letter-spacing:-.01em}
.sub{color:var(--mut);margin:4px 0 24px;font-size:13px}
.f{margin-bottom:16px}
label{display:flex;justify-content:space-between;font-size:13px;font-weight:500;margin-bottom:8px}
label a{color:var(--mut);font-weight:400}
.in{position:relative}
input{width:100%;height:36px;padding:0 12px;background:var(--card);border:1px solid var(--in);border-radius:8px;color:var(--fg);font:inherit;outline:0;transition:border-color .15s}
.solo input{background:var(--bg)}
input::placeholder{color:var(--sub)}
input:focus{border-color:var(--sub);box-shadow:0 0 0 1px var(--sub)}
.bad input{border-color:rgba(255,100,103,.6)}
.e{display:none;color:var(--loss);font-size:12px;margin-top:6px}.bad .e{display:block}
.eye{position:absolute;right:4px;top:4px;height:28px;padding:0 8px;border:0;background:0;color:var(--sub);border-radius:6px;font-size:11px;cursor:pointer}
.eye:hover{color:var(--fg);background:var(--acc)}
.btn{height:36px;width:100%;border-radius:8px;font:500 14px Geist,sans-serif;cursor:pointer;border:1px solid transparent;display:flex;align-items:center;justify-content:center;transition:background .15s}
.pri{background:var(--pri);color:#18181B}.pri:hover{background:#fff}.pri:disabled{opacity:.6;cursor:default}
.out{background:0;color:var(--fg);border-color:var(--bd)}.out:hover{background:var(--acc)}
.ghost{background:0;color:var(--mut)}.ghost:hover{background:var(--acc);color:var(--fg)}
.btn:focus-visible,.eye:focus-visible{outline:2px solid var(--sub);outline-offset:2px}
.oauth{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.or{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:12px;margin:20px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--bd)}
.foot{text-align:center;color:var(--mut);font-size:13px;margin-top:24px}.foot a{color:var(--fg);font-weight:500}
.fine{color:var(--sub);font-size:12px;margin-top:16px;text-align:center}.fine a{color:var(--mut)}
.solo{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px 16px;position:relative}
.solo>*{position:relative}
.solo:before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at center,#000,transparent 70%);mask-image:radial-gradient(ellipse at center,#000,transparent 70%);opacity:.6;pointer-events:none}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:32px}
.tile{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--bd);background:var(--acc);margin-bottom:20px}
.tile.p{background:#052E1A;border-color:rgba(34,197,94,.3);color:#4ADE80}
.meter{display:flex;gap:4px;margin-top:8px}.meter i{flex:1;height:4px;border-radius:9px;background:var(--acc);transition:background .2s}
.mt{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:500;line-height:16px;padding:2px 10px;border-radius:9px;border:1px solid var(--bd);color:var(--mut)}
.chip.p{background:#052E1A;color:#4ADE80;border-color:rgba(34,197,94,.3)}
.chip.l{background:#3B0A0C;color:#FF8A8C;border-color:rgba(255,100,103,.3)}
.side{background:var(--card);border-left:1px solid var(--bd);padding:48px;display:flex;flex-direction:column;justify-content:center}
.side>div{max-width:440px;width:100%;margin:0 auto}
.side h2{font-size:32px;line-height:38px;font-weight:500;letter-spacing:-.02em}
.side p{color:var(--mut);margin:8px 0 40px}
.ent{display:flex;gap:12px;animation:in .5s both;animation-delay:calc(var(--i)*.14s + .2s)}
.lft{display:flex;flex-direction:column;align-items:center}
.av{width:32px;height:32px;border-radius:99px;background:var(--acc);color:var(--mut);display:grid;place-items:center;font:500 11px 'Geist Mono',monospace;border:2px solid var(--card)}
.rail{flex:1;width:1px;background:var(--bd);margin:4px 0}
.rt{flex:1;padding-bottom:24px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:15px}.row span{color:var(--mut)}.row b{font-weight:500}
.time{font-size:12px;color:var(--sub);white-space:nowrap}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(max-width:900px){.split{grid-template-columns:1fr}.side{display:none}.pane{padding:24px 16px}}
@media(prefers-reduced-motion:reduce){.ent{animation:none}}
</style></head><body><main class=solo><a class=logo href=login.html><i><svg width=14 height=14 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2.4 stroke-linecap=round stroke-linejoin=round><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx=12 cy=12 r=3/></svg></i>TradeEye</a><div class=card>
<div id=form><div class=tile><svg width=18 height=18 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round><rect x=4 y=11 width=16 height=10 rx=2 /><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
<h1>Reset your password</h1><p class=sub>Choose a new password for your account.</p>
<form novalidate><div class=f><label for=p>New password</label><div class=in><input id=p type=password placeholder="••••••••" autocomplete=new-password><button class=eye type=button>Show</button></div><div class=meter><i></i><i></i><i></i><i></i></div><div class=mt><span class=ml>Use 8+ characters</span></div><div class=e>Use at least 8 characters.</div></div>
<div class=f><label for=c>Confirm password</label><input id=c type=password placeholder="••••••••" autocomplete=new-password><div class=e>Passwords don't match.</div></div>
<button class="btn pri" style=margin-top:24px>Update password</button></form></div>
<div id=ok hidden><div class="tile p"><svg width=18 height=18 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round><path d="m5 12 5 5 9-10"/></svg></div>
<h1>Password updated</h1><p class=sub>You're all set. Log in with your new password.</p>
<a class="btn pri" href=login.html>Continue to log in</a></div></div>
<p class=foot style=margin:0><a href=forgot-password.html>Request a new link</a></p>
</main><script>const $=s=>document.querySelector(s),em=v=>/^\S+@\S+\.\S+$/.test(v);
document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=b.parentNode.querySelector('input'),s=i.type=='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show'});
function bad(el,on){el.closest('.f').classList.toggle('bad',on);return on}
function load(b,t){const o=b.textContent;b.disabled=true;b.textContent=t;setTimeout(()=>{b.disabled=false;b.textContent=o},1400)}
function score(p){let s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p)||p.length>=14)s++;return p?Math.max(s,1):0}
function meter(i){const s=score(i.value),c=['','#FF6467','#FBBF24','#FAFAFA','#22C55E'][s];document.querySelectorAll('.meter i').forEach((e,k)=>e.style.background=k<s?c:'');$('.ml').textContent=['Use 8+ characters','Weak','Fair','Good','Strong'][s]}
$('#p').oninput=e=>meter(e.target);
$('form').onsubmit=e=>{e.preventDefault();const a=bad($('#p'),$('#p').value.length<8),b=bad($('#c'),$('#c').value!==$('#p').value);if(!a&&!b){$('#form').hidden=true;$('#ok').hidden=false}}
</script></body></html>
