<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Trades · TradeEye</title>
<link rel=preconnect href=https://fonts.googleapis.com><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel=stylesheet>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#09090B;--card:#18181B;--hi:#202023;--acc:#27272A;--fg:#FAFAFA;--mut:#A1A1AA;--sub:#71717B;--bd:rgba(255,255,255,.1);--in:rgba(255,255,255,.15);--pri:#E4E4E7;--profit:#22C55E;--loss:#FF6467;--sw:250px;--mono:'Geist Mono',ui-monospace,Menlo,monospace}
body{background:var(--bg);color:var(--fg);font:400 14px/22px Geist,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.c{--sw:60px}
button{font:inherit;color:inherit;background:0;border:0;cursor:pointer}
.m,.chip,.mk,.num,.sec,kbd,.av,#eq text,.dc,.wk,.tp{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible{outline:2px solid var(--sub);outline-offset:2px}
/* sidebar */
.sb{position:fixed;z-index:20;left:8px;top:8px;bottom:8px;width:var(--sw);background:var(--card);border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;padding:12px;transition:width .2s ease;overflow:hidden}
.hd{display:flex;align-items:center;gap:8px;height:36px;padding:0 6px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.logo{width:24px;height:24px;border-radius:8px;background:var(--pri);color:#18181B;display:grid;place-items:center;flex:none}.logo .ic{width:14px;height:14px;stroke-width:2.4}
.act{display:flex;margin:16px 0 4px}
.nt{flex:1;height:36px;border-radius:8px;background:var(--pri);color:#18181B;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s}.nt:hover{background:#fff}
.it,.sy{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 10px;border-radius:8px;color:var(--mut);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.it:hover,.sy:hover{background:var(--hi);color:var(--fg)}
.it.on{background:var(--acc);color:var(--fg)}
.lbl{flex:1;text-align:left;overflow:hidden}
.sy .lbl{font:400 12px var(--mono);color:var(--sub)}
.sy.s .ic{animation:sp .9s linear}@keyframes sp{to{transform:rotate(360deg)}}
.nav{flex:1;min-height:0;overflow:auto;scrollbar-width:none}
.sec{font-size:11px;font-weight:500;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);padding:20px 10px 8px;white-space:nowrap}
.chev{width:14px;height:14px;margin-left:auto;transition:transform .2s}
.it[aria-expanded=true] .chev{transform:rotate(180deg)}
.sub{margin:2px 0 4px 18px;padding-left:8px;border-left:1px solid var(--bd)}.sub .it{height:32px;font-weight:400}.sub[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;line-height:16px;padding:2px 10px;border-radius:9px;border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.chip.n{background:var(--acc);color:var(--fg);border:0}.chip.i{background:#0B1E4A;color:#93B4FF;border:0}
.chip.p{background:#052E1A;color:#4ADE80;border-color:rgba(34,197,94,.3)}.chip.l{background:#3B0A0C;color:#FF8A8C;border-color:rgba(255,100,103,.3)}
.bt{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.upd{background:var(--hi);border:1px solid var(--bd);border-radius:14px;padding:12px;font-size:12px;line-height:18px;color:var(--mut)}
.upd div{display:flex;justify-content:space-between;align-items:center;color:var(--fg);font-size:13px;font-weight:600}.upd p{margin:4px 0 12px}
.bn{width:100%;height:32px;border-radius:8px;border:1px solid var(--bd);color:var(--fg);font-size:13px;font-weight:500}.bn:hover{background:var(--acc)}
@media(min-width:768px){

.c .lbl,.c .sec,.c .upd,.c .sub,.c .cnt{display:none}
.c .hd{padding:0;justify-content:center}

.c .it,.c .sy{padding:0;justify-content:center}
.c .chev{position:absolute;right:2px;bottom:3px;width:9px;height:9px;margin:0}
.c .sec+.it,.c .nav>.sec:not(:first-child){}
.c .nav>.sec{display:block;height:1px;padding:0;margin:10px 4px;background:var(--bd);font-size:0}
}
/* main */
main{margin-left:calc(var(--sw) + 16px);padding:16px 32px 48px 24px;transition:margin .2s ease}
.wrap{max-width:1600px;margin:0 auto;container-type:inline-size}
.top{display:flex;align-items:center;gap:12px;height:48px;margin-bottom:16px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}.ib:hover:not(:disabled){background:var(--acc);color:var(--fg)}.ib:disabled{opacity:.35;cursor:default}

.srch input::placeholder{color:var(--sub)}.srch input:focus{border-color:var(--sub);box-shadow:0 0 0 1px var(--sub)}

.av{width:32px;height:32px;border-radius:99px;background:var(--acc);color:var(--mut);display:grid;place-items:center;font-size:11px;font-weight:500;flex:none}

.ct{font-size:14px;font-weight:600;line-height:20px}.cs{font-size:12px;color:var(--mut);line-height:16px;margin-top:2px}
.mk{font-size:11px;font-weight:500;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}

.seg button:first-child{border:0}.seg .on{background:var(--card);color:var(--fg)}
#eq{position:relative;height:280px}
#eq svg{display:block}#eq text{font-size:11px;fill:var(--sub)}
.tp{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:12px;line-height:16px;white-space:nowrap}.tp span{color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal .dh{font:500 11px/16px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--sub);text-align:center;padding-bottom:4px}

.dc b{font-size:13px;font-weight:500;line-height:16px;color:var(--fg)}.dc.z b{color:var(--sub)}
.dc.pw{background:color-mix(in srgb,#22C55E calc(var(--k)*22%),#052E1A);border-color:rgba(34,197,94,.3);color:#4ADE80}
.dc.ls{background:color-mix(in srgb,#FF6467 calc(var(--k)*22%),#3B0A0C);border-color:rgba(255,100,103,.3);color:#FF8A8C}
.dc.td{outline:1px solid var(--pri);outline-offset:2px}
.cf{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--bd)}
@container (max-width:599px){.cal{gap:4px}.dc{min-height:48px}.dc span{font-size:10px}}
.hdg{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.per{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--bd);border-radius:9999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.per button{height:28px;padding:0 12px;border-radius:9999px;font:500 13px var(--mono);color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.per button:hover{color:var(--fg)}.per .on{background:var(--acc);color:var(--fg)}
.mo{font-size:12px;min-width:64px;text-align:center;color:var(--mut)}
.br{margin-bottom:16px}.br:last-child{margin-bottom:0}
.br div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.br b{font:500 12px var(--mono);font-weight:500}

.lg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.ov{display:none}
@media(max-width:767px){
.sb{transform:translateX(-120%);width:250px;transition:transform .2s ease}body.o .sb{transform:none}

.srch{display:none}.av{margin-left:auto}
}

.chip.w{background:#3A2205;color:#FB923C;border:0}.chip.i{background:#0B1E4A;color:#93B4FF;border:0}
.hdg .seg button{display:flex;align-items:center;gap:8px;height:32px}
.sx{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.sx>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}.sx .v{font:600 24px/32px var(--mono);letter-spacing:-.02em;margin-top:4px}
.fb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

.fb .cnt2{margin-left:auto;font-size:12px;color:var(--sub)}
.tv{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.tbl{width:100%;border-collapse:collapse}.tbl th{position:sticky;top:0;text-align:left;font:500 11px/16px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card);white-space:nowrap}

.tk2{display:flex;align-items:center;gap:8px;font-family:Geist,sans-serif;font-weight:500;font-size:14px}.dim{color:var(--sub)}

.gi{position:relative;aspect-ratio:16/9;background:var(--bg);border-bottom:1px solid var(--bd)}.gi .chip{position:absolute;top:12px}.gi .l1{left:12px}.gi .r1{right:12px}
.gb{padding:16px;display:grid;gap:8px}.gb .r{display:flex;justify-content:space-between;align-items:baseline}.gb .m2{font-size:12px;color:var(--mut)}
.cw{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.cw .tv{padding:24px}.cn{display:flex;align-items:center;gap:8px;margin-bottom:16px}.cn h2{font:600 16px/22px Geist,sans-serif;margin-right:auto}
.tcal .dc{min-height:72px;cursor:pointer;font-family:var(--mono)}.tcal .dc small{font-size:10px;color:var(--sub)}.tcal .dc.sel{outline:1px solid var(--pri);outline-offset:2px}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
