<style>
*{box-sizing:border-box;margin:0}

return d};
let S={days:null,sel:null,open:{},q:'',f:'all',v:'split'};
try{S.days=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S.days)S.days=seed();
const tone=g=>g>=7?'p':g>=5?'w':'l',dts=()=>Object.keys(S.days).sort().reverse(),gl=g=>!g?'Not graded':g>=9?'Excellent':g>=7?'Good':g>=5?'Average':g>=3?'Weak':'Poor';
const fmt=d=>{const x=new Date(d+'T00:00:00');return[x.toLocaleDateString('en',{month:'short',day:'numeric'}),x.toLocaleDateString('en',{weekday:'short'})]};

let st;const save=()=>{const v=$('#sv');if(v)v.textContent='Saving…';clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem(K,JSON.stringify(S.days))}catch(e){}const v=$('#sv');if(v)v.textContent='Saved'},400)};
const cur=()=>{for(const d in S.days){const f=S.days[d].files.find(x=>x.id==S.sel);if(f)return[d,S.days[d],f]}};
const dm=y=>S.f=='hi'?y.g>=8:S.f=='lo'?y.g&&y.g<=4:S.f=='un'?!y.g:true,fm=f=>!S.q||(f.n+' '+f.b).toLowerCase().includes(S.q);
function tree(){const ae=document.activeElement,key=ae&&$('#tl').contains(ae)?(ae.dataset.d?`.dt[data-d="${ae.dataset.d}"]`:ae.dataset.f?`.tf[data-f="${ae.dataset.f}"]`:null):null;
let h='',cm='';for(const d of dts()){const y=S.days[d];if(!dm(y))continue;const fl=y.files.filter(fm);if(S.q&&!fl.length)continue;const mk=d.slice(0,7);
if(mk!=cm){cm=mk;h+=`<div class=mh><span>${new Date(d+'T00:00:00').toLocaleDateString('en',{month:'long',year:'numeric'})}</span><span>avg ${avg(dts().filter(x=>x.startsWith(mk)).map(x=>S.days[x].g).filter(Boolean))}</span></div>`}

/* markdown */
const inl=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target=_blank rel=noopener>$1</a>');
function md(t){const L=t.split('\n');let o='',l0=null,m;const cl=()=>{if(l0){o+='</'+l0+'>';l0=null}};
for(let i=0;i<L.length;i++){const l=L[i];
if(/^```/.test(l)){cl();const c=[];i++;while(i<L.length&&!/^```/.test(L[i]))c.push(L[i++]);o+='<pre><code>'+esc(c.join('\n'))+'</code></pre>';continue}
if(m=l.match(/^(#{1,3})\s+(.*)/)){cl();o+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
else if(m=l.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)/i)){if(l0!='ul.tk'){cl();o+='<ul class=tk>';l0='ul'}o+=`<li class="${m[1]!=' '?'dn':''}"><i></i><span>${inl(m[2])}</span></li>`}
else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(l0!='ul'){cl();o+='<ul>';l0='ul'}o+=`<li>${inl(m[1])}</li>`}
else if(m=l.match(/^\s*\d+\.\s+(.*)/)){if(l0!='ol'){cl();o+='<ol>';l0='ol'}o+=`<li>${inl(m[1])}</li>`}
else if(m=l.match(/^>\s?(.*)/)){cl();o+=`<blockquote>${inl(m[1])}</blockquote>`}
else if(/^---+$/.test(l)){cl();o+='<hr>'}else if(!l.trim())cl();else{cl();o+=`<p>${inl(l)}</p>`}}
cl();return o}

function paint(){const c=cur();if(!c)return;const y=c[1];$$('#gs button').forEach(b=>b.classList.toggle('on',+b.dataset.g==y.g));$('#gl').textContent=y.g?y.g+'/10 · '+gl(y.g):'Not graded';$$('#oc button').forEach(b=>b.classList.toggle('on',b.dataset.o==y.o));$$('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.v));$('#ed').dataset.v=S.v}

let arm;
